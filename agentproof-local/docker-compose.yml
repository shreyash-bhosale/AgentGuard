version: "3.8"

services:
  agentguard-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentguard-backend
    ports:
      - "8000:8000"
    environment:
      - AI_PROVIDER=gemma_cloud
      - GEMMA_MODEL=gemma-4-26b-a4b-it
      - GEMMA_API_KEY=${GEMMA_API_KEY:-}
      - GEMMA_ENDPOINT=${GEMMA_ENDPOINT:-}
      - AI_REQUEST_TIMEOUT_SECONDS=30
      - CORS_ORIGINS=http://localhost:5173,https://frontend-lake-delta-0bodi7q6wt.vercel.app
      - COMPANION_TOKEN=agentguard-local-secure-token
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
